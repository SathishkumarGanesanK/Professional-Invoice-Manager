<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Invoice Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @media print { 
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            @page { margin: 1cm; }
            .print-footer { position: fixed; bottom: 20px; width: 100%; text-align: center; font-size: 0.8rem; border-top: 1px solid #ccc; padding-top: 10px; }
        }
    </style>
</head>
<body class="bg-gray-100 p-8">

<div x-data="invoiceApp()" class="max-w-4xl mx-auto bg-white p-8 shadow-xl rounded-lg min-h-[90vh] relative">
    
    <div class="no-print flex justify-between items-center mb-8 border-b pb-4">
        <div class="flex gap-4">
            <button @click="activeTab = 'invoice'" :class="activeTab === 'invoice' ? 'font-bold underline' : ''">Invoice View</button>
            <button @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'font-bold underline' : ''">Settings & Master Data</button>
        </div>
        <button x-show="activeTab === 'invoice'" @click="printInvoice()" class="bg-purple-600 text-white px-6 py-2 rounded font-bold shadow-md">Print Invoice</button>
    </div>

    <div x-show="activeTab === 'invoice'">
        <div class="flex justify-between border-b pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold" x-text="config.businessName"></h1>
                <p class="text-gray-600 whitespace-pre-line" x-text="config.businessAddress"></p>
            </div>
            <div class="text-right">
                <p class="font-bold">Invoice #: <span x-text="config.invoicePrefix + config.invoiceNumber"></span></p>
                <p>Date: <span x-text="config.invoiceDate"></span></p>
            </div>
        </div>
        
        <div class="mb-8">
            <h3 class="font-bold text-gray-500 uppercase text-sm">Bill To:</h3>
            <p class="font-bold text-lg" x-text="client.name"></p>
            <p class="text-gray-600 whitespace-pre-line" x-text="client.address"></p>
        </div>

        <table class="w-full mb-8">
            <thead class="border-b bg-gray-50">
                <tr class="text-left">
                    <th class="p-2">Item</th>
                    <th class="p-2">Unit</th>
                    <th class="p-2">Unit Price</th>
                    <th class="p-2 text-right">Total</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="(item, index) in items" :key="index">
                    <tr class="border-b">
                        <td class="p-2" x-text="item.desc"></td>
                        <td class="p-2" x-text="item.unit"></td>
                        <td class="p-2" x-text="config.currency + parseFloat(item.price || 0).toFixed(2)"></td>
                        <!-- Total = Unit * Unit Price -->
                        <td class="p-2 text-right font-semibold" x-text="config.currency + itemTotal(item).toFixed(2)"></td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div class="text-right font-bold text-xl space-y-2">
            <p>Subtotal: <span x-text="config.currency + subTotal.toFixed(2)"></span></p>
            <template x-if="config.useTax"><p>Tax (<span x-text="config.taxRate"></span>%): <span x-text="config.currency + taxAmount.toFixed(2)"></span></p></template>
            <p>Grand Total: <span x-text="config.currency + grandTotal.toFixed(2)"></span></p>
        </div>
        <div class="print-footer">This is an electronically generated document, no signature is required.</div>
    </div>

    <div x-show="activeTab === 'settings'" class="no-print space-y-8">
        
        <div class="grid grid-cols-2 gap-8 border-b pb-8">
            <div>
                <h2 class="text-xl font-bold mb-4">Manage Clients</h2>
                <template x-for="(c, i) in master.clients" :key="i">
                    <div class="flex gap-2 mb-2"><input x-model="c.name" class="border p-1 w-1/3" placeholder="Name"><input x-model="c.address" class="border p-1 flex-grow" placeholder="Address"><button @click="master.clients.splice(i,1)" class="text-red-500">✕</button></div>
                </template>
                <button @click="master.clients.push({name:'', address:''})" class="bg-blue-600 text-white px-2 py-1 text-sm">+ Add Client</button>
            </div>
            <div>
                <h2 class="text-xl font-bold mb-4">Manage Products</h2>
                <template x-for="(p, i) in master.products" :key="i">
                    <div class="flex gap-2 mb-2"><input x-model="p.desc" class="border p-1 flex-grow" placeholder="Product"><input x-model.number="p.price" class="border p-1 w-20" placeholder="Price"><button @click="master.products.splice(i,1)" class="text-red-500">✕</button></div>
                </template>
                <button @click="master.products.push({desc:'', price:0})" class="bg-blue-600 text-white px-2 py-1 text-sm">+ Add Product</button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-8">
            <div>
                <h2 class="text-xl font-bold mb-4">Invoice Configuration</h2>
                <input x-model="config.businessName" class="border p-2 w-full mb-2" placeholder="Business Name">
                <textarea x-model="config.businessAddress" class="border p-2 w-full mb-2" placeholder="Business Address"></textarea>
                <div class="flex gap-2 mb-2">
                    <input x-model="config.currency" class="border p-2 w-16" placeholder="$">
                    <input x-model="config.invoicePrefix" class="border p-2 w-24" placeholder="Prefix">
                    <input x-model.number="config.invoiceNumber" type="number" class="border p-2 w-20" placeholder="#">
                    <input x-model="config.invoiceDate" type="date" class="border p-2 w-32">
                </div>
                <div class="flex items-center gap-2 mt-2 border p-2 bg-gray-50">
                    <input type="checkbox" x-model="config.useTax">
                    <label>Enable Tax</label>
                    <input x-model.number="config.taxRate" type="number" class="border p-1 w-20" placeholder="Tax %">
                </div>
            </div>
            <div>
                <h2 class="text-xl font-bold mb-4">Invoice Builder</h2>
                <select @change="applyClient($event.target.value)" class="border p-2 w-full mb-2">
                    <option value="">Select Client...</option>
                    <template x-for="(c, i) in master.clients" :key="i"><option :value="i" x-text="c.name"></option></template>
                </select>
                <div class="flex gap-2">
                    <select id="prodSelect" class="border p-2 flex-grow">
                        <option value="">Select Item...</option>
                        <template x-for="(p, i) in master.products" :key="i"><option :value="i" x-text="p.desc"></option></template>
                    </select>
                    <input type="number" step="any" min="0" id="unitInput" class="border p-2 w-24" placeholder="Qty / Unit" value="1">
                    <button @click="addToInvoice()" class="bg-green-600 text-white px-4 py-2">Add</button>
                </div>
                
                <h2 class="text-sm font-bold mt-4">Active Invoice Items:</h2>
                <template x-for="(item, index) in items" :key="index">
                    <div class="flex gap-2 mt-2 items-center text-sm border p-1 bg-gray-50">
                        <span class="flex-grow" x-text="`${item.desc} | Unit: ${item.unit} | Unit Price: ${config.currency}${parseFloat(item.price || 0).toFixed(2)} | Total: ${config.currency}${itemTotal(item).toFixed(2)}`"></span>
                        <button @click="items.splice(index,1)" class="text-red-500 font-bold px-1">✕</button>
                    </div>
                </template>
            </div>
        </div>

        <button @click="saveAll()" class="bg-purple-600 text-white px-8 py-3 rounded font-bold w-full">Save Master & Invoice Data</button>
        
        <div class="flex gap-4 pt-4 border-t">
            <button @click="exportData()" class="bg-gray-600 text-white px-4 py-2 rounded text-sm w-1/2">Export Settings</button>
            <label class="bg-gray-600 text-white px-4 py-2 rounded text-sm w-1/2 text-center cursor-pointer">
                Import Settings
                <input type="file" @change="importData($event)" class="hidden">
            </label>
        </div>
    </div>
</div>

<script>
    function invoiceApp() {
        return {
            activeTab: 'invoice',
            config: JSON.parse(localStorage.getItem('config')) || { businessName: 'My Company', businessAddress: '', currency: '$', invoicePrefix: 'INV-', invoiceNumber: 1001, invoiceDate: new Date().toISOString().split('T')[0], taxRate: 0, useTax: false },
            client: JSON.parse(localStorage.getItem('client')) || { name: '', address: '' },
            items: JSON.parse(localStorage.getItem('items')) || [],
            master: JSON.parse(localStorage.getItem('master')) || { clients: [], products: [] },
            
            // Helper calculation: extracts numeric value even if units have labels, then multiplies
            itemTotal(item) {
                const rawUnit = String(item.unit || '').replace(/[^0-9.]/g, '');
                const unitVal = rawUnit === '' ? 1 : parseFloat(rawUnit);
                const priceVal = parseFloat(item.price || 0);
                return (isNaN(unitVal) ? 1 : unitVal) * (isNaN(priceVal) ? 0 : priceVal);
            },
            
            get subTotal() { 
                return this.items.reduce((sum, item) => sum + this.itemTotal(item), 0); 
            },
            get taxAmount() { return this.config.useTax ? this.subTotal * (this.config.taxRate / 100) : 0; },
            get grandTotal() { return this.subTotal + this.taxAmount; },
            
            applyClient(i) { this.client = { ...this.master.clients[i] }; },
            addToInvoice() {
                const i = document.getElementById('prodSelect').value;
                const unitInput = document.getElementById('unitInput');
                const unit = unitInput.value.trim() === '' ? 1 : unitInput.value;
                if(i === "") return;
                const p = this.master.products[i];
                this.items.push({ desc: p.desc, unit: unit, price: parseFloat(p.price || 0) });
            },
            
            exportData() {
                const data = JSON.stringify({ config: this.config, client: this.client, items: this.items, master: this.master });
                const blob = new Blob([data], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'invoice-data.json'; a.click();
            },
            importData(event) {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = JSON.parse(e.target.result);
                    this.config = data.config; this.client = data.client; this.items = data.items; this.master = data.master;
                    this.saveAll(); alert('Data Imported!');
                }; reader.readAsText(file);
            },
            
            printInvoice() { window.print(); },
            saveAll() {
                localStorage.setItem('config', JSON.stringify(this.config));
                localStorage.setItem('client', JSON.stringify(this.client));
                localStorage.setItem('items', JSON.stringify(this.items));
                localStorage.setItem('master', JSON.stringify(this.master));
                alert('All data saved successfully!');
            }
        }
    }
</script>
</body>
</html>
